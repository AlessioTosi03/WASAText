openapi: 3.0.3
servers:
  - url: "http://localhost:3000"
info:
  title: WASAText
  description: Fantastic Coffee (decaffeinated), the skeleton project for Web and Software architecture course
  version: 1.0.0

components:
  schemas:
    StatusInfo:
      title: Status Info
      type: object
      properties:
        status:
          type: string
          enum:
            - info
            - warning
            - critical
            - ""
        title: { type: string }
        message: { type: string }
        url: { type: string }
    Conversation:
      title: conversation
      description: "This object represents a single conversation."
      type: object
      properties:
        id:
          description: Unique identifier.
          type: integer
          example: 1
          readOnly: true
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        details:
            oneOf:
              - $ref: '#/components/schemas/Chat'
              - $ref: '#/components/schemas/Group'
    Group:
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
      properties:
        name:
          description: name of the group.
          type: string
          example: the koalas
        description:
          description: "the description of the group."
          type: string
        groupPicURL:
          type: string
          format: uri
        participants:
          description: the list of the group participants
          type: array
          items: { $ref: "#/components/schemas/User" }
    Chat:
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
      properties:
        chatters:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/User" }
    Message:
      title: message
      description: "This object represents a single message."
      type: object
      properties:
        id:
          description: Unique message identifier.
          type: integer
          example: 1
          readOnly: true
        content:
          description: Content of this message, photo or text.
          oneOf:
            - type: string
              description: a text message.
            - type: string
              format: binary
              description: a photo message.
        received:
          description: list of the people that have received the message.
          type: array
          items: 
            $ref: "#/components/schemas/User"
        read:
          description: list of the people that have read the message.
          type: array
          items: 
            $ref: "#/components/schemas/User"
    ForwardMessage:
      type: object
      properties:
        originalMessageID:
          type: string
          description: The ID of the message being forwarded.
    Reaction:
      title: reaction
      description: "This object represents a single reaction."
      type: object
      properties:
        messageID:
          type: integer
          description: ID of the reacted message.
        userID:
          type: integer
          description: ID of the reacter.
        text:
          description: emoji Unicode.
          type: string
          example: "🙂"
      required: [pictureID, userID, text]
    User:
      title: user
      description: "This object represents a single user."
      type: object
      properties:
        id:
          description: Unique user identifier.
          type: integer
          example: 1
          readOnly: true
        name:
          description: name of the user.
          type: string
          example: andre23Z
        profilePicURL:
          type: string
          format: uri
  responses:
    Unauthorized:
      description: The access token is missing or it's expired
    BadRequest:
      description: The request was not compliant with the documentation (eg. missing fields, etc)
    InternalServerError:
      description: The server encountered an internal error. Further info in server logs

  securitySchemes:
    BearerAuth: # arbitrary name for the security scheme
      type: http
      scheme: bearer
      bearerFormat: JWT # optional, arbitrary value for documentation purposes

  parameters:
    MessageID:
      schema:
        type: integer
        example: 1
        readOnly: true
      name: messageId
      in: path
      required: true
      description: Message identifier.
      allowEmptyValue: false
    UserID:
      schema:
        type: integer
        example: 42
        readOnly: true
      name: userId
      in: path
      required: true
      description: Unique identifier for a user.
      allowEmptyValue: false
    ConversationID:
      schema:
        type: integer
        example: 27
        readOnly: true
      name: conversationId
      in: path
      required: true
      description: Unique identifier for a conversation.
      allowEmptyValue: false
      
paths:
  /status:
    get:
      tags: ["Get services"]
      operationId: getStatusMessage
      summary: Get status message for the user about issues / updates
      description: |-
        The response contains a status message meant for the user. It might
        contains information about current technical issues, update messages
        or general information.
      responses:
        "200":
          description: Status message available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusInfo"
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /:
    get:
      tags: ["Get services"]
      operationId: index
      summary: Get an index
      description: |-
        This is an example of an index API description
      responses:
        "200":
          description: Successful
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  
  /session:
    post:
      tags: ["login"]
      summary: Logs in the user
      description: |-
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      security: []
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Maria
                  pattern: 'ˆ.*?$'
                  minLength: 3
                  maxLength: 16
        required: true
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    # change here if you decide to use an integer
                    # or any other type of identifier
                    type: string
                    example: "abcdef012345"
                  message:
                    type: string
                    example: "Login Successful"
  /Users/{userId}/name:
    put:
      tags: ["Profile"]
      operationId: setMyUserName
      summary: Modify my Username
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        description: New username to be set
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: "newUsername123"
                  minLength: 3
                  maxLength: 16
              required:
                - username
      responses:
        "200":
          description: Username updated successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: User not found }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /Users/{userId}/photo:
    put:
      tags: ["Profile"]
      operationId: setMyPhoto
      summary: Change my photo
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        description: New photo to be set
        content:
          application/json:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: uri
              required:
                - photo
      responses:
        "200":
          description: Profile photo updated successfully
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /chat/{conversationId}:
    post:
      operationId: addToGroup
      summary: Add one or more users to a group
      description: Adds users to the specified group.
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      tags: ["Conversations"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userIDs:
                  type: array
                  items:
                    $ref: "#/components/parameters/UserID"
              required:
                - userIDs
      responses:
        "200":
          description: Users added successfully
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Unauthorized (missing or invalid token)
        "404":
          description: Conversation not found
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: ["Conversations"]
      operationId: leaveGroup
      summary: Leave a group
      description: Remove partecipation from a group.
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      responses:
        "204":
          description: Message deleted successfully.
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /chat/{conversationId}/name:
    put:
      operationId: setGroupName
      summary: Set a group name
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      tags: ["Conversations"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The new name of the group
              required:
                - name
      responses:
        "200":
          description: Group name modified successfully
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Unauthorized (missing or invalid token)
        "404":
          description: Conversation not found
        "500":
          $ref: "#/components/responses/InternalServerError"
  
  /chat/{conversationId}/photo:
    put:
      tags: ["Conversations"]
      operationId: setGroupPhoto
      summary: Change group photo
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      requestBody:
        description: New photo to be set
        content:
          application/json:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: uri
              required:
                - photo
      responses:
        "200":
          description: Group photo updated successfully
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /chat/{conversationId}/messages:
    get:
      operationId: getConversation
      summary: Get messages from a conversation
      description: Retrieves all messages from the specified conversation.
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      tags: ["Conversations"]
      responses:
        "200":
          description: List of private chat messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Conversation not found
        "401":
          description: Unauthorized (missing or invalid token)
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: Send a message in a conversation
      description: Post a new message in a specific conversation (either private or group).
      operationId: sendMessage
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      tags:
        - Messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Message"  # Link to Message schema
      responses:
        "200":
          description: Message sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"  # Same Message schema to return the sent message
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Unauthorized (missing or invalid token)
        "404":
          description: Conversation not found
        "500":
          $ref: "#/components/responses/InternalServerError"

  /chat/{conversationId}/forward:
    post:
      summary: Forward an existing message
      description: Forward an existing message to the specified conversation.
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForwardMessage"
      responses:
        "200":
          description: Message sent successfully
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Unauthorized (missing or invalid token)
        "404":
          description: Conversation not found
        "500":
          $ref: "#/components/responses/InternalServerError"

  /chat/{conversationId}/{messageId}/:
    delete:
      tags: ["Messages"]
      operationId: deleteMessage
      summary: Delete a message
      description: Deleting a message from a conversation.
      parameters:
        - $ref: "#/components/parameters/ConversationID"
        - $ref: "#/components/parameters/MessageID"
      responses:
        "204":
          description: Message deleted successfully.
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /chat/{conversationId}/{messageId}/reaction:
    post:
      operationId: commentMessage
      summary: Reacting to a message
      description: Reacting a message of the specified conversation.
      parameters:
        - $ref: "#/components/parameters/ConversationID"
        - $ref: "#/components/parameters/MessageID"
      tags: ["Messages"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reaction"
      responses:
        "200":
          description: Message sent successfully
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Unauthorized (missing or invalid token)
        "404":
          description: Conversation not found
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: ["Messages"]
      operationId: uncommentMessage
      summary: Unfollow another user
      description: Deleting the reaction to a message
      parameters:
        - $ref: "#/components/parameters/ConversationID"
        - $ref: "#/components/parameters/MessageID"
      responses:
        "204":
          description: Reaction deleted successfully.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: User not found }
        "500": { $ref: "#/components/responses/InternalServerError" }
    
  /stream:
    get:
      tags:
        - "Get services"
      operationId: getMyConversations
      summary: Get personal conversations stream
      description: Retrieve a stream of the authenticated user's conversations.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Chats retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
        "401":
          description: Unauthorized access
        "500":
          $ref: "#/components/responses/InternalServerError"
